name: Mettre a jour le flux RSS

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch: {}      # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Installer le navigateur Playwright (sites en JavaScript)
        run: playwright install --with-deps chromium

      - name: Lancer le scraper
        run: python scraper.py

      - name: Publier les changements
        run: |
          git config user.name "veille-encheres-bot"
          git config user.email "actions@github.com"
          git add feed.xml data/seen.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau a publier."
            exit 0
          fi
          git commit -m "Mise a jour automatique du flux"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Publie."
              exit 0
            fi
            echo "Push refuse (le depot a change entre-temps), nouvelle tentative apres rebase..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase impossible, abandon."; git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 1))
          done
          echo "Echec apres plusieurs tentatives."
          exit 1
