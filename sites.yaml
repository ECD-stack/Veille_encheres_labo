# Configuration des sites a surveiller.
#
# Pour chaque site, renseigne :
#   name           : nom affiche dans le flux (obligatoire)
#   url            : URL de la page qui liste les encheres (obligatoire)
#   enabled        : true pour activer ce site, false pour le desactiver sans le supprimer
#   js             : true si les annonces N'APPARAISSENT PAS quand tu fais clic droit > "Afficher
#                    le code source de la page" (Ctrl+U) -> le contenu est charge par JavaScript
#                    et il faut un navigateur pour le lire. false si tu VOIS les titres des
#                    annonces dans le code source -> scraping simple, plus rapide et plus fiable.
#   item_selector  : selecteur CSS du bloc qui se repete une fois par annonce
#   title_selector : selecteur CSS du titre A L'INTERIEUR de ce bloc (vide si le bloc est lui-meme le titre)
#   link_selector  : selecteur CSS du lien <a> A L'INTERIEUR de ce bloc (vide si le bloc est lui-meme le <a>)
#   wait_selector  : (uniquement si js: true) un selecteur CSS a attendre avant de lire la page,
#                    pour laisser le temps au JavaScript de charger les annonces
#   keywords       : (optionnel) si tu mets une liste de mots-cles, seules les annonces dont le
#                    titre contient au moins un de ces mots seront gardees dans le flux
#
# Les trois sites pilotes ci-dessous ont deja ete inspectes directement dans un navigateur
# (structure HTML lue en direct sur chaque page, le 01/09/2026) : les selecteurs sont
# verifies et fonctionnels a cette date, enabled est deja a true. Un site peut a tout moment
# changer la structure de ses pages ; si le flux s'arrete de se remplir pour l'un d'eux,
# dis-le et on relit la page ensemble pour corriger les selecteurs.
#
# Pour ajouter un nouveau site toi-meme, duplique le modele vierge tout en bas et demande a
# ce qu'on repere les selecteurs ensemble si tu ne veux pas le faire a la main.

sites:
  - name: "Interencheres - Materiel medical / laboratoire"
    url: "https://www.interencheres.com/materiels-professionnels/materiel-medical-laboratoire/"
    enabled: true
    js: false        # verifie : le contenu est present dans le HTML initial (rendu serveur)
    item_selector: "a.d-flex.fill-height"   # le bloc EST le lien
    title_selector: ".title"
    link_selector: ""                        # vide : le bloc est deja le <a>
    keywords: []

  - name: "Dome Auctions - Equipement de laboratoire"
    url: "https://dome-auctions.com/fr/autres-categories-industrielles/equipement-de-laboratoire/"
    enabled: true
    js: false        # verifie : le contenu est present dans le HTML initial (rendu serveur)
    item_selector: "article.lot-card"
    title_selector: "h3.card-title"
    link_selector: "a.js-view-lot"
    keywords: []
    
  - name: "LabX - Auctions"
    url: "https://www.labx.com/auctions"
    enabled: true
    js: false        # verifie : le contenu est present dans le HTML initial (rendu serveur)
    item_selector: ".ae__event__card"
    title_selector: ".ae__event__title"
    link_selector: ".ae__event__button"
    keywords: []
    
  - name: "Laboccaz - Equipements de laboratoire"
    url: "https://app.laboccaz.com/?tab=recherche&subtab=references&type=Mat%C3%A9riels&categorie=%C3%89quipements%20de%20laboratoire"
    enabled: true
    js: true               # verifie : application Bubble, contenu charge en JavaScript
    wait_selector: ".Group.cmhaTd1"
    item_selector: ".clickable-element.Group.cmhaTc1"
    title_selector: ".Group.cmhaTd1"
    no_item_links: true    # MODE DEGRADE : ce site ne fournit aucun lien individuel par annonce
                            # (application Bubble sans URL par fiche). Le lien du flux pointera
                            # vers cette page de recherche, pas vers l'annonce precise.
    keywords: []
    # Attention : ce site est construit avec un outil (Bubble) qui regenere ses noms de classes
    # techniques a chaque modification de la page par son editeur. C'est le site le plus fragile
    # de la liste : si le flux cesse de se remplir pour lui, il faudra refaire l'inspection.

    

  # Modele vierge a dupliquer pour ajouter un nouveau site :
  # - name: "Nom du site"
  #   url: "https://..."
  #   enabled: true
  #   js: false
  #   item_selector: ""
  #   title_selector: ""
  #   link_selector: ""
  #   keywords: []
